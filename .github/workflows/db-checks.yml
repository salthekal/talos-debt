name: Checks

# Runs on every pull request and push to main: builds the database from
# the migrations, loads the fake seed data, and runs the safety checks.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Build database and run checks
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./scripts/db-reset.sh

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: npm ci
      - run: npm run typecheck
      - name: Run API tests
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The dashboard in a real browser against the real API and database,
  # in English and Arabic, light and dark, desktop and phone (web/e2e).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql and openpyxl
        # From apt, so the system Python finds it (e2e/run.sh runs Python isolated, without user packages).
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client python3-openpyxl
      - name: Install
        run: |
          (cd api && npm ci)
          (cd web && npm ci && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium)
      - name: Database
        run: ./scripts/db-reset.sh
      - name: Start the API and the dashboard
        run: |
          cd api
          NODE_ENV=development PORT=3000 AUTH_MODE=session MAIL_DRIVER=log APP_URL=http://localhost:5173 \
          DATABASE_URL=postgres://talos_api:talos_api_dev@localhost:5432/talos_dev \
          WORKER_DATABASE_URL=postgres://talos_jobs:talos_jobs_dev@localhost:5432/talos_dev \
          WHATSAPP_DEV_REDIRECT_TO=+966500000000 STORAGE_DRIVER=local LOG_LEVEL=warn \
          nohup npx tsx src/server.ts > ../api.log 2>&1 &
          cd ../web && nohup npx vite --port 5173 --strictPort > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/health >/dev/null && curl -sf localhost:5173 >/dev/null && exit 0; sleep 1; done
          cat ../api.log ../web.log; exit 1
      - name: End-to-end run
        working-directory: web
        run: ./e2e/run.sh
      - name: Logs
        if: failure()
        run: cat api.log web.log
