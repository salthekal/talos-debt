# Local development database: PostgreSQL 16 with pgvector.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the data)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: talos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talos_dev
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - talos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talos_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  talos_db_data:
